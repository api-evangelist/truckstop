apis:
  - name: Truckstop Load Management API
    description: REST API for posting, updating, refreshing, and deleting loads on the Truckstop load board. Includes Load Boost for promoted visibility, pause/unpause for BIN loads, and tender management for booked loads.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.truckstop.com/reference/load-management-1
    baseURL: https://api.truckstop.com
    tags:
      - Load Management
      - Load Board
      - Freight
    properties:
      - type: Documentation
        url: https://developer.truckstop.com/reference/load-management-1
      - type: OpenAPI
        url: https://developer.truckstop.com/llms.txt

  - name: Truckstop Load Search API
    description: API for carriers and brokers to search available loads on the Truckstop load board with filtering, sorting, and bulk detail retrieval.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.truckstop.com/reference/load-operations
    baseURL: https://api.truckstop.com
    tags:
      - Load Search
      - Freight
      - Carrier
    properties:
      - type: Documentation
        url: https://developer.truckstop.com/reference/load-operations

  - name: Truckstop Carrier Network API
    description: API for managing carrier networks, including bulk add/update/remove by DOT number, preferred carrier lists, carrier groups, compliance status access, and carrier search within groups.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.truckstop.com/reference/general-overview
    baseURL: https://api.truckstop.com
    tags:
      - Carrier Network
      - Compliance
      - Brokers
    tags_raw:
      - Carrier Network
      - Compliance
      - Broker
    properties:
      - type: Documentation
        url: https://developer.truckstop.com/reference/general-overview

  - name: Truckstop Rate Insights API
    description: API for accessing predictive rate data including booked rate estimates and trendlines over 4-week and 36-month periods, posted rate estimates, and rate crowdsourcing submissions.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.truckstop.com/reference/rate-insights-v3
    baseURL: https://api.truckstop.com
    tags:
      - Rate Insights
      - Freight Rates
      - Analytics
    properties:
      - type: Documentation
        url: https://developer.truckstop.com/reference/rate-insights-v3

  - name: Truckstop Risk Factor API
    description: API for carrier risk analysis including single and multiple carrier risk reports by MC/DOT number, search by email or phone, RMIS certification status queries, and monitored carrier list management.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.truckstop.com/reference/general-overview
    baseURL: https://api.truckstop.com
    tags:
      - Risk Factor
      - Compliance
      - RMIS
      - Carrier
    properties:
      - type: Documentation
        url: https://developer.truckstop.com/reference/general-overview

  - name: Truckstop Truck Management API
    description: API for posting trucks with equipment options, searching posted trucks, viewing truck details individually and in bulk, deleting trucks, and accessing Hot Prospects hidden capacity search.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.truckstop.com/reference/general-overview
    baseURL: https://api.truckstop.com
    tags:
      - Truck Posting
      - Capacity
      - Carrier
    properties:
      - type: Documentation
        url: https://developer.truckstop.com/reference/general-overview

  - name: Truckstop Document API
    description: API for managing freight-related documents associated with loads and transactions on the Truckstop platform.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.truckstop.com/reference/document-api
    baseURL: https://api.truckstop.com
    tags:
      - Documents
      - Freight
    properties:
      - type: Documentation
        url: https://developer.truckstop.com/reference/document-api

  - name: Truckstop Booked Rates API
    description: API for retrieving booked load details by Load ID, tender details by Tender ID, CSV exports of booked loads, and tenders by account for freight payment processing.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.truckstop.com/reference/booked-rates
    baseURL: https://api.truckstop.com
    tags:
      - Booked Rates
      - Tender Management
      - Freight Payment
    properties:
      - type: Documentation
        url: https://developer.truckstop.com/reference/booked-rates

